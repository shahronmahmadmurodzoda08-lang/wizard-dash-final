name: Build Wizard Dash Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/grimoire/wizarddash/MainActivity.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/script.js
          test -f app/src/main/assets/style.css
          test -f app/src/main/assets/logo.jpg
          test -f app/src/main/res/drawable-nodpi/wizard_dash_logo.jpg

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check app/src/main/assets/script.js

      - name: Build debug APK
        run: gradle --no-daemon --no-parallel --max-workers=2 :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wizard-dash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
